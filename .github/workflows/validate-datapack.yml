name: Validar y Publicar Data Pack Comunitario

on:
  pull_request_target:
    types: [opened, synchronize]
    paths:
      - 'proposals/**.json'

concurrency:
  group: datapack-index-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio base (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Obtener archivo de propuesta del PR
        id: proposal
        run: |
          git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-branch
          PROPOSAL_FILE=$(git diff --name-only main..pr-branch | grep '^proposals/.*\.json$' | head -n 1)
          if [ -z "$PROPOSAL_FILE" ]; then
            echo "No se encontró ningún archivo de propuesta en proposals/"
            exit 1
          fi
          git checkout pr-branch -- "$PROPOSAL_FILE"
          echo "file=$PROPOSAL_FILE" >> $GITHUB_OUTPUT

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install requests

      - name: Validar paquete y generar entrada
        run: |
          python scripts/validate_and_index.py \
            --proposal "${{ steps.proposal.outputs.file }}" \
            --catalog "catalog/card_ids.json" \
            --blocklist "catalog/blocked_terms.json" \
            --max-zip-mb 50.0 \
            --max-unpacked-mb 150.0 \
            --output "validated_pack.json"

      - name: Fusionar datos al índice
        run: |
          python scripts/merge_into_index.py

      - name: Commit y Push al main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add datapacks_index.json
          git commit -m "Auto-indexar data pack validado [skip ci]" || echo "No hay cambios"
          git push origin main

      - name: Auto-Merge Pull Request
        uses: pascalgn/automerge-action@v0.16.4
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          MERGE_METHOD: "squash"
          MERGE_COMMIT_MESSAGE: "pull-request-title"
