name: Validar Data Pack

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'proposals/**.json'

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio base (main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Obtener archivo de propuesta del PR
        id: proposal
        run: |
          git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-branch
          PROPOSAL_FILE=$(git diff --name-only main..pr-branch | grep '^proposals/.*\.json$' | head -n 1)
          if [ -z "$PROPOSAL_FILE" ]; then
            echo "No se encontró ningún archivo de propuesta en proposals/" >&2
            exit 1
          fi
          git checkout pr-branch -- "$PROPOSAL_FILE"
          echo "file=$PROPOSAL_FILE" >> $GITHUB_OUTPUT

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install requests

      - name: Validar paquete
        run: |
          python scripts/validate_and_index.py \
            --proposal "${{ steps.proposal.outputs.file }}" \
            --catalog "catalog/card_ids.json" \
            --blocklist "catalog/blocked_terms.json" \
            --max-zip-mb 100.0 \
            --max-unpacked-mb 300.0 \
            --output "validated_pack.json"

      # Los workflows disparados por "workflow_run" no comparten el checkout
      # del primero, así que guardamos el resultado como artifact para que
      # el segundo workflow (merge-datapack.yml) lo recoja.
      - name: Guardar resultado validado
        uses: actions/upload-artifact@v4
        with:
          name: validated-pack-${{ github.event.pull_request.number }}
          path: validated_pack.json
          retention-days: 1
